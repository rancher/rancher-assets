name: Push to rancher/rancher

on:
  release:
    types: [ published ]
  # Remove the following ones after we confirm release triggers will work
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref (commit SHA, tag, or branch)'
        required: true
        type: string
      rancher_minor:
        description: 'Rancher minor version (e.g., 2.16)'
        required: true
        type: string
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref (commit SHA, tag, or branch)'
        required: true
        type: string
      rancher_minor:
        description: 'Rancher minor version (e.g., 2.16)'
        required: true
        type: string

jobs:
  parse-release:
    name: Parse release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ steps.parse.outputs.ref }}
      rancher_minor: ${{ steps.parse.outputs.minor }}
    steps:
      - name: Parse release tag
        id: parse
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Parsing release tag: $TAG"

          # Extract minor version from tag (v2.16-20260901T1200Z[-dev] -> 2.16)
          MINOR=$(echo "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+)-.*/\1/p')

          if [ -z "$MINOR" ]; then
            echo "ERROR: Could not extract minor version from tag: $TAG"
            exit 1
          fi

          echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "Extracted: ref=${{ github.sha }}, minor=$MINOR"

  push-to-rancher:
    name: Push to rancher/rancher
    needs: [parse-release]
    if: always() && !cancelled() && (github.event_name != 'release' || needs.parse-release.result == 'success')
    runs-on: ubuntu-latest
    # Prevent duplicate runs for same commit+minor (when both dev and stable tags trigger)
    concurrency:
      group: push-to-rancher-${{ needs.parse-release.outputs.git_ref || inputs.git_ref }}-${{ needs.parse-release.outputs.rancher_minor || inputs.rancher_minor }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    steps:
      - name: Checkout rancher-assets repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read GitHub App Credentials from Vault
        if: github.repository == 'rancher/rancher-assets'
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App Token
        if: github.repository == 'rancher/rancher-assets'
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          repositories: |
            rancher

      - name: Checkout rancher repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/rancher
          token: ${{ steps.generate_token.outputs.token }}
          path: ${{ github.workspace }}/rancher-repo
          persist-credentials: true

      - name: Push updates to rancher/rancher
        if: github.repository == 'rancher/rancher-assets'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          APP_USER: "${{ steps.generate_token.outputs.app-slug }}[bot]"
          SOURCE_REPO: ${{ github.repository }}
          ASSETS_DIR: ${{ github.workspace }}
          RANCHER_DIR: ${{ github.workspace }}/rancher-repo
        run: ./.github/workflows/push-to-rancher/run-gha.sh
