name: Auto Release

# Tier 1 Workflow: Detects changed Dockerfiles and creates CalVer tags
# Tag creation triggers Tier 2 (release.yml) which builds the Docker images

on:
  push:
    branches:
      - main
    paths:
      - 'dockerfiles/**'
      - 'lock.yaml'

permissions:
  contents: write
  id-token: write # required for OIDC -> Vault

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to detect changes
          persist-credentials: false

      - name: Detect release targets
        id: detect
        run: |
          echo "Detecting release targets between ${{ github.event.before }} and ${{ github.sha }}..."

          # One "<minor> <build_type>" pair per line
          RELEASE_TARGETS=$(./.github/scripts/detect-release-targets.sh \
            ${{ github.event.before }} \
            ${{ github.sha }})

          if [ -z "$RELEASE_TARGETS" ]; then
            echo "No release targets"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Release targets:"
          echo "$RELEASE_TARGETS"
          echo ""

          echo "release_targets<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_TARGETS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Exit if no changes
        if: steps.detect.outputs.has_changes == 'false'
        run: |
          echo "No release targets - skipping tag creation"
          exit 0

      - name: Read GitHub App creds from Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        if: github.repository == 'rancher/rancher-assets'
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Checkout repository with app token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git bot identity
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.name "eio-github-actions-power-enhancer[bot]"
          git config user.email "860038+eio-github-actions-power-enhancer[bot]@users.noreply.github.com"

      - name: Create tags for each release target
        if: steps.detect.outputs.has_changes == 'true'
        id: create_tags
        env:
          RELEASE_TARGETS: ${{ steps.detect.outputs.release_targets }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Each target is "<minor> <build_type>". Prod only when rancher-charts' prod
          # commit moved; everything else is dev (see detect-release-targets.sh).
          # To ship a prod image for any other reason, push a prod CalVer tag by hand;
          # release.yml builds any v* tag.
          DOCKERFILES=""

          while read -r minor type; do
            [ -z "$minor" ] && continue

            dockerfile="dockerfiles/Dockerfile.$minor"
            [ "$type" = "dev" ] && dockerfile="$dockerfile-dev"

            if [ ! -f "$dockerfile" ]; then
              echo "Skipping $dockerfile (not found)"
              continue
            fi

            eval $(./.github/scripts/parse-dockerfile-name.sh "$dockerfile")

            TAG=$(./.github/scripts/generate-calver-tag.sh \
              "$RANCHER_MINOR" \
              "$BUILD_TYPE" \
              "$COMMIT_SHA")
            echo "$dockerfile -> $TAG"

            ./.github/scripts/create-tag.sh "$TAG" "$COMMIT_SHA" "$dockerfile"
            DOCKERFILES="$DOCKERFILES$dockerfile"$'\n'
          done <<< "$RELEASE_TARGETS"

          echo "dockerfiles<<EOF" >> $GITHUB_OUTPUT
          printf '%s' "$DOCKERFILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push all tags atomically
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Pushing all tags to origin..."

          TAGS=$(git tag --points-at ${{ github.sha }})

          if [ -z "$TAGS" ]; then
            echo "No tags to push"
            exit 0
          fi

          echo "Tags to push:"
          echo "$TAGS"
          echo ""

          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] && git push origin "$tag"
          done

          echo ""
          echo "All tags pushed successfully"

      - name: Summary
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "## Auto Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Created and pushed CalVer tags for changed Dockerfiles:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          git tag --points-at ${{ github.sha }} | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These tags will trigger the [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml) to build Docker images." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tagged Dockerfiles" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.create_tags.outputs.dockerfiles }}" | while read dockerfile; do
            if [ -n "$dockerfile" ]; then
              echo "- \`$dockerfile\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
