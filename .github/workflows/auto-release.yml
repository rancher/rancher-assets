name: Auto Release

# Tier 1 Workflow: Detects changed Dockerfiles and creates CalVer tags
# Tag creation triggers Tier 2 (release.yml) which builds the Docker images

on:
  push:
    branches:
      - main
    paths:
      - 'dockerfiles/**'
      - 'lock.yaml'

permissions:
  contents: write
  id-token: write # required for OIDC -> Vault

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to detect changes

      - name: Detect changed Dockerfiles
        id: detect
        run: |
          echo "Detecting changed Dockerfiles between ${{ github.event.before }} and ${{ github.sha }}..."

          CHANGED=$(./.github/scripts/detect-changed-dockerfiles.sh \
            ${{ github.event.before }} \
            ${{ github.sha }})

          if [ -z "$CHANGED" ]; then
            echo "No Dockerfiles changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed Dockerfiles:"
          echo "$CHANGED"
          echo ""

          echo "dockerfiles<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Exit if no changes
        if: steps.detect.outputs.has_changes == 'false'
        run: |
          echo "No Dockerfiles changed - skipping tag creation"
          exit 0

      - name: Read GitHub App creds from Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        if: github.repository == 'rancher/rancher-assets'
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Switch Git CLI to Vault App Token
        run: |
          # 1. Unset default extraheader from actions/checkout
          git config --local --unset http.https://github.com/.extraheader
          
          # 2. Set new authorization extraheader using the Vault token
          TOKEN_B64=$(echo -n "x-access-token:${{ steps.app-token.outputs.token }}" | base64 -w 0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${TOKEN_B64}"

      - name: Configure git bot identity
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.name "eio-github-actions-power-enhancer[bot]"
          git config user.email "860038+eio-github-actions-power-enhancer[bot]@users.noreply.github.com"

      - name: Create tags for each Dockerfile
        if: steps.detect.outputs.has_changes == 'true'
        id: create_tags
        run: |
          COMMIT_SHA="${{ github.sha }}"
          TAGS=()

          echo "Creating CalVer tags for changed Dockerfiles..."
          echo ""

          echo "${{ steps.detect.outputs.dockerfiles }}" | while IFS= read -r dockerfile; do
            if [ -z "$dockerfile" ]; then
              continue
            fi

            echo "Processing: $dockerfile"

            eval $(./.github/scripts/parse-dockerfile-name.sh "$dockerfile")
            echo "  Rancher Minor: $RANCHER_MINOR"
            echo "  Build Type: $BUILD_TYPE"

            TAG=$(./.github/scripts/generate-calver-tag.sh \
              "$RANCHER_MINOR" \
              "$BUILD_TYPE" \
              "$COMMIT_SHA")
            echo "  Tag: $TAG"

            ./.github/scripts/create-tag.sh "$TAG" "$COMMIT_SHA" "$dockerfile"

            TAGS+=("$TAG")
            echo ""
          done

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "${TAGS[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push all tags atomically
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Pushing all tags to origin..."

          TAGS=$(git tag --points-at ${{ github.sha }})

          if [ -z "$TAGS" ]; then
            echo "No tags to push"
            exit 0
          fi

          echo "Tags to push:"
          echo "$TAGS"
          echo ""

          echo "$TAGS" | xargs git push origin

          echo ""
          echo "All tags pushed successfully"

      - name: Summary
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "## Auto Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Created and pushed CalVer tags for changed Dockerfiles:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          git tag --points-at ${{ github.sha }} | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These tags will trigger the [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml) to build Docker images." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Dockerfiles" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.detect.outputs.dockerfiles }}" | while read dockerfile; do
            if [ -n "$dockerfile" ]; then
              echo "- \`$dockerfile\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
