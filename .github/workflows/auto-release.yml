name: Auto Release

# Tier 1 Workflow: Detects changed Dockerfiles and creates CalVer tags
# Tag creation triggers Tier 2 (release.yml) which builds the Docker images

on:
  push:
    branches:
      - main
    paths:
      - 'dockerfiles/**'
      - 'lock.yaml'

permissions:
  contents: write  # Needed to create and push tags
  actions: write   # Needed to trigger release workflow

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to detect changes

      - name: Detect changed Dockerfiles
        id: detect
        run: |
          echo "Detecting changed Dockerfiles between ${{ github.event.before }} and ${{ github.sha }}..."

          CHANGED=$(./.github/scripts/detect-changed-dockerfiles.sh \
            ${{ github.event.before }} \
            ${{ github.sha }})

          if [ -z "$CHANGED" ]; then
            echo "No Dockerfiles changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed Dockerfiles:"
          echo "$CHANGED"
          echo ""

          echo "dockerfiles<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Exit if no changes
        if: steps.detect.outputs.has_changes == 'false'
        run: |
          echo "No Dockerfiles changed - skipping tag creation"
          exit 0

      - name: Configure git
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tags for each Dockerfile
        if: steps.detect.outputs.has_changes == 'true'
        id: create_tags
        run: |
          COMMIT_SHA="${{ github.sha }}"
          TAGS=()

          echo "Creating CalVer tags for changed Dockerfiles..."
          echo ""

          echo "${{ steps.detect.outputs.dockerfiles }}" | while IFS= read -r dockerfile; do
            if [ -z "$dockerfile" ]; then
              continue
            fi

            echo "Processing: $dockerfile"

            eval $(./.github/scripts/parse-dockerfile-name.sh "$dockerfile")
            echo "  Rancher Minor: $RANCHER_MINOR"
            echo "  Build Type: $BUILD_TYPE"

            TAG=$(./.github/scripts/generate-calver-tag.sh \
              "$RANCHER_MINOR" \
              "$BUILD_TYPE" \
              "$COMMIT_SHA")
            echo "  Tag: $TAG"

            ./.github/scripts/create-tag.sh "$TAG" "$COMMIT_SHA" "$dockerfile"

            TAGS+=("$TAG")
            echo ""
          done

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "${TAGS[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push all tags atomically
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Pushing all tags to origin..."

          TAGS=$(git tag --points-at ${{ github.sha }})

          if [ -z "$TAGS" ]; then
            echo "No tags to push"
            exit 0
          fi

          echo "Tags to push:"
          echo "$TAGS"
          echo ""

          echo "$TAGS" | xargs git push origin

          echo ""
          echo "All tags pushed successfully"

      - name: Trigger release workflow for each tag
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Triggering release workflow for each tag..."

          TAGS=$(git tag --points-at ${{ github.sha }})

          for tag in $TAGS; do
            echo "Triggering release for tag: $tag"
            gh workflow run release.yml \
              --ref "$tag" \
              --field tag="$tag"
          done

          echo ""
          echo "All release workflows triggered successfully"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "## Auto Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Created and pushed CalVer tags for changed Dockerfiles:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          git tag --points-at ${{ github.sha }} | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These tags will trigger the [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml) to build Docker images." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Dockerfiles" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.detect.outputs.dockerfiles }}" | while read dockerfile; do
            if [ -n "$dockerfile" ]; then
              echo "- \`$dockerfile\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
