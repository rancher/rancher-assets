name: PR CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run tests
        run: ./scripts/test

      - name: Run generate
        run: make generate

      - name: Verify generated files are committed
        run: ./scripts/verify
