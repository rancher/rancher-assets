name: PR Builder Cron

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch for PR'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '0 11 * * 1-5' # Runs at 11:00 UTC Monday through Friday

permissions:
  contents: write
  id-token: write # required for OIDC -> Vault
  pull-requests: write

jobs:
  bump-pr-builder:
    name: Bump Chart References
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read GitHub App creds from Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        if: github.repository == 'rancher/rancher-assets'
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target-repo
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Run bump-pr-builder
        if: github.repository == 'rancher/rancher-assets'
        env:
          CI: true
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_USER: "eio-github-actions-power-enhancer[bot]"
          SOURCE_REPO: ${{ github.repository }}
          REPO_DIR: "${{ github.workspace }}/target-repo"
        run: ./.github/workflows/bump-pr-builder/run-gha.sh
