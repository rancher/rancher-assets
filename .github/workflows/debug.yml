name: Debug

on:
  workflow_dispatch:

permissions:
  contents: write  # Needed to create and push tags
  id-token: write  # this is important, it's how we authenticate with Vault

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to detect changes
          persist-credentials: false # Prevent git from ignoring the oauth token

      - name: "Read vault secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            github/token/rancher--rancher-assets--contents--write token | GH_APP_TOKEN;

      - name: Diagnostic - GitHub App Identity
        run: |
         echo "=================== DIAGNOSTIC MODE ==================="
         echo ""
         echo "🔍 Checking GitHub App Token..."
      
         # Check token format
         TOKEN_PREFIX="${GH_APP_TOKEN:0:4}"
         TOKEN_LENGTH="${#GH_APP_TOKEN}"
         echo "Token prefix: ${TOKEN_PREFIX}..."
         echo "Token length: ${TOKEN_LENGTH} characters"
      
         if [[ "$TOKEN_PREFIX" == "ghs_" ]]; then
           echo "✅ Token format: GitHub App installation token"
         fi
      
         echo ""
         echo "🔍 Querying GitHub API for installation details..."
      
         # For GitHub App tokens, use the /app endpoint (requires app-level permissions)
         # Or use the installation endpoint
         INSTALLATION_INFO=$(curl -s -H "Authorization: Bearer ${GH_APP_TOKEN}" \
           -H "Accept: application/vnd.github+json" \
           https://api.github.com/installation/repositories)
      
         echo "Installation repositories:"
         echo "$INSTALLATION_INFO" | jq '{total_count, repositories: [.repositories[]? | {name, full_name}]}'
      
         # Try to get app information from a different endpoint
         echo ""
         echo "🔍 Getting app information from authenticated endpoint..."
      
         # Try the app-installations endpoint
         APP_INFO=$(curl -s -H "Authorization: Bearer ${GH_APP_TOKEN}" \
           -H "Accept: application/vnd.github+json" \
           https://api.github.com/app)
      
         echo "GitHub App details:"
         echo "$APP_INFO" | jq '{name, slug, owner: .owner.login}'
      
         APP_SLUG=$(echo "$APP_INFO" | jq -r '.slug // empty')
         APP_NAME=$(echo "$APP_INFO" | jq -r '.name // empty')
      
         echo ""
         echo "========== RECOMMENDATION =========="
         if [[ -n "$APP_SLUG" && "$APP_SLUG" != "null" ]]; then
           echo "✅ GitHub App identified: $APP_NAME"
           echo "   Slug: $APP_SLUG"
           echo ""
           echo "Recommended git identity for auto-release workflow:"
           echo "  git config user.name \"${APP_SLUG}[bot]\""
           echo "  git config user.email \"${APP_SLUG}[bot]@users.noreply.github.com\""
         else
           echo "ℹ️  Could not determine app slug from API"
           echo ""
           echo "Try checking the git commits made by this app in other repos,"
           echo "or contact your team to identify which GitHub App this token belongs to."
         fi
         echo "===================================="
      
         echo ""
         echo "Diagnostic complete. No tags created."
        env:
          GH_APP_TOKEN: ${{ env.GH_APP_TOKEN }}