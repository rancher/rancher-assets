name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write  # Needed to create and push tags
  id-token: write  # this is important, it's how we authenticate with Vault

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to detect changes
          persist-credentials: false # Prevent git from ignoring the oauth token

      - name: Detect changed Dockerfiles
        id: detect
        run: |
          echo "Detecting changed Dockerfiles between ${{ github.event.before }} and ${{ github.sha }}..."

          CHANGED=$(./.github/scripts/detect-changed-dockerfiles.sh \
            ${{ github.event.before }} \
            ${{ github.sha }})

          if [ -z "$CHANGED" ]; then
            echo "No Dockerfiles changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed Dockerfiles:"
          echo "$CHANGED"
          echo ""

          echo "dockerfiles<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Exit if no changes
        if: steps.detect.outputs.has_changes == 'false'
        run: |
          echo "No Dockerfiles changed - skipping tag creation"
          exit 0

      - name: "Read vault secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            github/token/rancher--rancher-assets--contents--write token | GH_APP_TOKEN;

      - name: Diagnostic - GitHub App Identity
        run: |
          echo "=================== DIAGNOSTIC MODE ==================="
          echo ""
          echo "🔍 Checking GitHub App Token..."
          
          # Check token format
          TOKEN_PREFIX="${GH_APP_TOKEN:0:4}"
          TOKEN_LENGTH="${#GH_APP_TOKEN}"
          echo "Token prefix: ${TOKEN_PREFIX}..."
          echo "Token length: ${TOKEN_LENGTH} characters"
          
          if [[ "$TOKEN_PREFIX" == "ghs_" ]]; then
            echo "✅ Token format: GitHub App installation token"
          elif [[ "$TOKEN_PREFIX" == "ghp_" ]]; then
            echo "⚠️  Token format: Personal Access Token"
          elif [[ "$TOKEN_PREFIX" == "gho_" ]]; then
            echo "⚠️  Token format: OAuth token"
          else
            echo "⚠️  Token format: Unknown ($TOKEN_PREFIX)"
          fi
          
          echo ""
          echo "🔍 Querying GitHub API for token identity..."
          
          # Get the identity associated with this token
          USER_INFO=$(curl -s -H "Authorization: Bearer ${GH_APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)
          
          echo "Token authenticates as:"
          echo "$USER_INFO" | jq '{
            login: .login,
            name: .name,
            type: .type,
            id: .id
          }'
          
          LOGIN=$(echo "$USER_INFO" | jq -r '.login')
          TYPE=$(echo "$USER_INFO" | jq -r '.type')
          
          echo ""
          echo "========== RECOMMENDATION =========="
          if [[ "$LOGIN" == "github-actions[bot]" ]]; then
            echo "❌ WARNING: Token authenticates as 'github-actions[bot]'"
            echo "This will NOT trigger downstream workflows!"
            echo ""
            echo "Action needed: This appears to be GITHUB_TOKEN, not a GitHub App token."
            echo "Verify the Vault secret contains a proper GitHub App installation token."
          elif [[ "$TYPE" == "Bot" ]]; then
            echo "✅ Token authenticates as a Bot account: $LOGIN"
            echo ""
            echo "Recommended git identity for auto-release workflow:"
            echo "  git config user.name \"$LOGIN\""
            echo "  git config user.email \"$LOGIN@users.noreply.github.com\""
          else
            echo "ℹ️  Token authenticates as: $LOGIN (type: $TYPE)"
            echo ""
            echo "Recommended git identity:"
            echo "  git config user.name \"$LOGIN\""
            EMAIL=$(echo "$USER_INFO" | jq -r '.email // empty')
            if [[ -n "$EMAIL" && "$EMAIL" != "null" ]]; then
              echo "  git config user.email \"$EMAIL\""
            else
              echo "  git config user.email \"$LOGIN@users.noreply.github.com\""
            fi
          fi
          echo "===================================="
          
          echo ""
          echo "Diagnostic complete. No tags created."
        env:
          GH_APP_TOKEN: ${{ env.GH_APP_TOKEN }}