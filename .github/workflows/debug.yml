name: Debug

on:
  workflow_dispatch:

permissions:
  contents: write  # Needed to create and push tags
  id-token: write  # this is important, it's how we authenticate with Vault

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to detect changes
          persist-credentials: false # Prevent git from ignoring the oauth token

      - name: "Read vault secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            github/token/rancher--rancher-assets--contents--write token | GH_APP_TOKEN;

      - name: Test Tag Creation and Push Authentication
        run: |
          echo "=================== TESTING TAG PUSH ==================="
          echo ""
          
          # Create a test tag
          TEST_TAG="debug-test-$(date +%s)"
          echo "Creating test tag: $TEST_TAG"
          
          # Configure git identity
          git config user.name "eio-github-actions-power-enhancer[bot]"
          git config user.email "eio-github-actions-power-enhancer[bot]@users.noreply.github.com"
          
          # Create annotated tag
          git tag -a "$TEST_TAG" -m "Debug test tag from workflow"
          
          echo "✅ Tag created locally"
          echo ""
          
          # Test 1: Push using remote name (current method)
          echo "📤 Test 1: Push using git remote (current method)"
          git remote set-url origin "https://oauth2:${{ env.GH_APP_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "$TEST_TAG" || echo "Push failed!"
          
          echo ""
          sleep 5  # Give GitHub time to process
          
          # Check who GitHub thinks pushed it
          echo "🔍 Checking push actor via GitHub API..."
          EVENTS=$(curl -s \
           -H "Authorization: Bearer ${{ env.GH_APP_TOKEN }}" \
           -H "Accept: application/vnd.github+json" \
           "https://api.github.com/repos/${{ github.repository }}/events" \
           | jq '.[] | select(.type == "CreateEvent") | select(.payload.ref_type == "tag") | select(.payload.ref == "'"$TEST_TAG"'") | .actor.login')
          
          echo "Tag '$TEST_TAG' was pushed by actor: $EVENTS"
          
          if [[ "$EVENTS" == "\"eio-github-actions-power-enhancer[bot]\"" ]]; then
           echo "✅ SUCCESS: GitHub App token was used!"
          elif [[ "$EVENTS" == "\"github-actions[bot]\"" ]]; then
           echo "❌ FAIL: GITHUB_TOKEN was used instead of App token"
          else
           echo "⚠️  UNKNOWN: Actor is $EVENTS"
          fi
          
          echo ""
          echo "🔍 Checking if any workflows were triggered..."
          sleep 10  # Give workflows time to start
          
          TRIGGERED_RUNS=$(curl -s \
           -H "Authorization: Bearer ${{ env.GH_APP_TOKEN }}" \
           -H "Accept: application/vnd.github+json" \
           "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=push&created=>$(date -u -v-1M '+%Y-%m-%dT%H:%M:%SZ')" \
           | jq '.workflow_runs[] | select(.head_branch == "'"$TEST_TAG"'") | {name, status, conclusion}')
          
          if [[ -z "$TRIGGERED_RUNS" ]]; then
           echo "❌ No workflows triggered by this tag"
          else
           echo "✅ Workflows triggered:"
           echo "$TRIGGERED_RUNS"
          fi
          
          echo ""
          echo "Cleaning up test tag..."
          git push origin --delete "$TEST_TAG" || echo "Cleanup failed (tag may not exist remotely)"
          git tag -d "$TEST_TAG"
          
          echo ""
          echo "===================================="
        env:
         GH_APP_TOKEN: ${{ env.GH_APP_TOKEN }}