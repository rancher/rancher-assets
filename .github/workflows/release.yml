name: Build and Release

# Tier 2 Workflow: Triggered by (CalVer) tags to build and push Docker images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PUBLIC_REGISTRY: docker.io
  PUBLIC_REPO: rancher

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      rancher_minor: ${{ steps.parse.outputs.rancher_minor }}
      build_type: ${{ steps.parse.outputs.build_type }}
      release_id: ${{ steps.create_draft.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse CalVer tag
        id: parse
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Parsing tag: $VERSION"

          # CalVer format: v{RANCHER_MINOR}-{YYYYMMDD}T{HHMM}Z[-dev]
          # Examples:
          #   v2.15-20260716T1430Z-dev  (prerelease/dev build)
          #   v2.14-20260805T1600Z      (stable/prod build)

          if [[ "$VERSION" =~ ^v([0-9]+\.[0-9]+)-[0-9]{8}T[0-9]{4}Z-dev$ ]]; then
            RANCHER_MINOR="${BASH_REMATCH[1]}"
            BUILD_TYPE=dev
            PRERELEASE=true
            echo "CalVer prerelease detected - DEV build"
            echo "   Rancher Minor: $RANCHER_MINOR"
          elif [[ "$VERSION" =~ ^v([0-9]+\.[0-9]+)-[0-9]{8}T[0-9]{4}Z$ ]]; then
            RANCHER_MINOR="${BASH_REMATCH[1]}"
            BUILD_TYPE=prod
            PRERELEASE=false
            echo "CalVer stable detected - PROD build"
            echo "   Rancher Minor: $RANCHER_MINOR"
          else
            echo "ERROR: Invalid CalVer tag format: $VERSION"
            echo "Expected: v{RANCHER_MINOR}-{YYYYMMDD}T{HHMM}Z[-dev]"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "rancher_minor=$RANCHER_MINOR" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Get tag message
        id: tag_message
        run: |
          VERSION=${{ steps.parse.outputs.version }}
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$VERSION")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate draft release body
        id: draft_body
        run: |
          BODY=$(.github/scripts/generate-release-notes.sh \
            "${{ steps.parse.outputs.version }}" \
            "${{ steps.parse.outputs.rancher_minor }}" \
            "${{ steps.parse.outputs.build_type }}" \
            --draft \
            --tag-message "${{ steps.tag_message.outputs.message }}")

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create_draft
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.parse.outputs.version }}
          release_name: Rancher Assets ${{ steps.parse.outputs.version }}
          draft: true
          prerelease: ${{ steps.parse.outputs.prerelease }}
          body: ${{ steps.draft_body.outputs.body }}

  build-and-push:
    needs: parse-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Read vault secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | PRIME_STG_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | PRIME_STG_REGISTRY_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | PRIME_STG_REGISTRY_PASSWORD ;

      - name: Build and push `rancher-assets` image (dockerhub and prime stg)
        uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
        env:
          RANCHER_MINOR: ${{ needs.parse-tag.outputs.rancher_minor }}
          DEV: ${{ needs.parse-tag.outputs.build_type == 'dev' }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          image: "rancher-assets"
          tag: ${{ github.ref_name }}
          public-registry: ${{ env.PUBLIC_REGISTRY }}
          public-repo: ${{ env.PUBLIC_REPO }}
          public-username: ${{ env.DOCKER_USERNAME || vars.DOCKER_USERNAME || github.repository_owner }}
          public-password: ${{ env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}
          push-to-prime: true
          prime-registry: ${{ env.PRIME_STG_REGISTRY }}
          prime-repo: rancher
          prime-username: ${{ env.PRIME_STG_REGISTRY_USERNAME }}
          prime-password: ${{ env.PRIME_STG_REGISTRY_PASSWORD }}

      - name: "Read vault secrets (prime prod)"
        if: ${{ needs.parse-tag.outputs.build_type != 'dev' }}
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;

      - name: Build and push `rancher-assets` image (prime prod)
        if: ${{ needs.parse-tag.outputs.build_type != 'dev' }}
        uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
        env:
          RANCHER_MINOR: ${{ needs.parse-tag.outputs.rancher_minor }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          image: "rancher-assets"
          tag: ${{ github.ref_name }}
          push-to-public: false
          push-to-prime: true
          prime-registry: ${{ env.PRIME_REGISTRY }}
          prime-repo: rancher
          prime-username: ${{ env.PRIME_REGISTRY_USERNAME }}
          prime-password: ${{ env.PRIME_REGISTRY_PASSWORD }}

      - name: Setup Go
        if: success()
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'

      - name: Generate image lists from local image
        if: success()
        run: |
          ./scripts/export-image-lists.sh \
            --image "${{ env.PUBLIC_REGISTRY }}/${{ env.PUBLIC_REPO }}/rancher-assets:${{ needs.parse-tag.outputs.version }}" \
            --version "${{ needs.parse-tag.outputs.version }}" \
            --output-dir "dist/${{ needs.parse-tag.outputs.version }}" \
            --local

      - name: Upload image lists as release assets
        if: success()
        run: |
          VERSION="${{ needs.parse-tag.outputs.version }}"
          gh release upload "$VERSION" dist/$VERSION/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag message
        if: success()
        id: tag_message
        run: |
          VERSION=${{ needs.parse-tag.outputs.version }}
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$VERSION")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate final release body
        if: success()
        run: |
          .github/scripts/generate-release-notes.sh \
            "${{ needs.parse-tag.outputs.version }}" \
            "${{ needs.parse-tag.outputs.rancher_minor }}" \
            "${{ needs.parse-tag.outputs.build_type }}" \
            --tag-message "${{ steps.tag_message.outputs.message }}" \
            > /tmp/release-notes.md

      - name: Read Vault App token for release publishing
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            github/token/rancher--rancher-assets--contents--write token | APP_TOKEN

      - name: Publish release (undraft)
        if: success()
        run: |
          VERSION="${{ needs.parse-tag.outputs.version }}"
          gh release edit "$VERSION" \
            --draft=false \
            --notes-file /tmp/release-notes.md
          echo "Release $VERSION published successfully!"
        env:
          GH_TOKEN: ${{ env.APP_TOKEN }}
