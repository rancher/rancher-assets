name: Auto Merge Bump PR

# Auto-approves and merges the scheduled "Bump chart references" PR opened by
# pr-builder-cron.yml, once its CI checks pass.

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.user.login == 'rancher-pr-actions-write[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'status/auto-created') &&
      github.event.pull_request.title == 'Bump chart references and update generated files' &&
      startsWith(github.event.pull_request.head.ref, 'bot/bump-chart-refs-') &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open'
    steps:
      - name: Generate Auto-Approve App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTO_APPROVE_APP_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Wait for required checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fixed check names, not "all checks" - this workflow's own check-run
          # would otherwise show up pending and wait on itself forever.
          REQUIRED_CHECKS=("Lint" "Test & Verify" "summary")

          for CHECK_NAME in "${REQUIRED_CHECKS[@]}"; do

            echo "Waiting for check: $CHECK_NAME"
            while true; do

              # gh's own --jq flag takes exactly one arg (the filter string) and has no --arg support,
              # so we pipe into the real jq binary instead to parameterize CHECK_NAME safely.
              # Unlike gh's --jq (which auto-strips quotes from scalar results),
              # real jq keeps JSON string quoting by default
              # - output is "SUCCESS", not SUCCESS -
              # which breaks a bare `case "$STATUS" in SUCCESS)` - match unless -r (raw output) is added to jq.
              STATUS=$(
                  gh pr checks "$PR_NUMBER" \
                      --repo "$REPO" \
                      --json name,state \
                      | jq -r --arg name "$CHECK_NAME" \
                      'map(select(.name == $name)) | .[0].state // "PENDING"'
              )

              echo "STATUS: ${STATUS}"
              case "$STATUS" in
                PENDING|IN_PROGRESS|QUEUED)     echo "sleeping 30" && sleep 30 ;;
                SUCCESS)                        echo "  ✓ $CHECK_NAME succeeded"; break ;;
                FAILURE|ERROR|CANCELLED)        echo "  ✗ $CHECK_NAME failed ($STATUS)"; exit 1 ;;
                *) sleep 30 ;;
              esac

            done
          done

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$REPO" \
            --approve \
            --body "Auto-approving: PR was generated by bump-pr-builder."

      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api --method PUT "/repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$COMMIT_SHA" \
            -f merge_method=squash \
            -f commit_title="Auto-merge: $PR_TITLE"
